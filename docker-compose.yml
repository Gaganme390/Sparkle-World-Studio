version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Cloud / Local Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: gd_goenka_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-gd_goenka_db}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - gd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-gd_goenka_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # GD Goenka Ayodhya Web Application Service
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gd_goenka_web
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://${PGUSER:-postgres}:${PGPASSWORD:-postgres}@db:5432/${PGDATABASE:-gd_goenka_db}
    depends_on:
      db:
        condition: service_healthy

volumes:
  gd_postgres_data:
    driver: local
